<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="assets/fevicon.jpg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      integrity="sha512-..."
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.9/css/weather-icons.min.css">
  </head>
  <body>
    <div class="mainContainer">
      <div class="container">
        <div class="searchBar">
          <input type="search" placeholder="Search City">
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>
        <div class="mainContent">
          <div class="mainWeather">
            <div class="mainWeatherLeft">
                <div class="mainWeatherLeft1">
                    <i class="fa-solid fa-location-dot"></i>
                    <p id="location"> </p>
                </div>
                <div class="mainWeatherLeft2">
                    <img src="" alt="weather icon" id="weatherIcon">
                </div>
            </div>
            <div class="mainWeatherRight">
                <div class="mainWeatherRight1">
                    <P id="dateTime"> Wed 07 Aug </P>
                </div>
                <div class="mainWeatherRight2">
                    <p id="temperature"> 32 C</p>
                    <p id="clouds"> Clouds </p>
                </div>
            </div>
          </div>
          <div class="secondaryWeather">
            <div class="secondaryWeather1">
                <i class="fa-solid fa-droplet"></i>
                <p> Humidity <br> 58% </p>
            </div>
            <div class="secondaryWeather2">
                <i class="fa-solid fa-wind"></i>
                <p> Wind Speed <br> <span id="windSpeed"> 2.06 M/s </span></p> 
            </div>
          </div>
          <div class="forecastWeatherMain">
            <div class="forecastWeather1 forecastWeather">
                <p id="forecastDate1"> Aug 08 </p>
                <p id="forecastTemp1"> 32 C</p>
            </div>
            <div class="forecastWeather2 forecastWeather">
                <p id="forecastDate2"> Aug 08 </p>
                <p id="forecastTemp2"> 32 C</p>
            </div>
            <div class="forecastWeather3 forecastWeather">
                <p id="forecastDate3"> Aug 08 </p>
                <p id="forecastTemp3"> 32 C</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
