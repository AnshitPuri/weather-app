<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="assets/fevicon.jpg" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      integrity="sha512-..."
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <div class="mainContainer">
      <div class="container">
        <div class="searchBar">
          <input type="search" placeholder="Search City">
          <i class="fa-solid fa-magnifying-glass"></i>
        </div>
        <div class="mainContent">
          <div class="mainWeather">
            <div class="mainWeather1"></div>
            <div class="mainWeather2"></div>
          </div>
          <div class="secondaryWeather">
            <div class="secondaryWeather1"></div>
            <div class="secondaryWeather2"></div>
          </div>
          <div class="forecastWeather">
            <div class="forecastWeather1"></div>
            <div class="forecastWeather2"></div>
            <div class="forecastWeather3"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
